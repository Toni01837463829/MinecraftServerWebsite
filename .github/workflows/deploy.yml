# Publishes the website on GitHub Pages, after every change in this repository and when you click
# "Run workflow". The stats are NOT part of this: the page reads them live from Supabase.
#
# It writes config.js from this repository's VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   SUPABASE_URL              like https://abcd.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the publishable key (starts with sb_publishable_). It can only read, so it may be public.
#   SERVER_NAME, SERVER_ADDRESS  optional, shown on the website
# NEVER put the secret key here: everything in config.js is visible to everyone.
name: Update website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one update at a time. A new one waits until the running one is done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Write the website with config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SERVER_NAME: ${{ vars.SERVER_NAME }}
          SERVER_ADDRESS: ${{ vars.SERVER_ADDRESS }}
        run: |
          rm -rf _site && cp -r site _site
          node -e '
            const env = n => (process.env[n] || "").trim();
            const key = env("SUPABASE_PUBLISHABLE_KEY");
            if (key.startsWith("sb_secret_")) {
              console.log("::error::SUPABASE_PUBLISHABLE_KEY is the SECRET key. Delete it right away and create a new secret key in Supabase. Use the publishable key here.");
              process.exit(1);
            }
            if (!env("SUPABASE_URL") || !key) {
              console.log("::warning::The variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY are not set yet. The website says \"not set up\". See README.md, Setup.");
            }
            const config = {
              supabaseUrl: env("SUPABASE_URL").replace(/\/+$/, "").replace(/\/rest\/v1$/, ""),
              supabaseKey: key,
              serverName: env("SERVER_NAME"),
              serverAddress: env("SERVER_ADDRESS"),
            };
            require("fs").writeFileSync("_site/config.js", "window.SITE_CONFIG = " + JSON.stringify(config) + ";\n");
            console.log("config.js written for " + (config.supabaseUrl || "(no Supabase address yet)"));
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
