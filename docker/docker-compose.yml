# Test setup on your own PC that works like Supabase + GitHub Pages. Nothing here touches the real
# server, the real Supabase project or the real website.
#
#   cd docker
#   docker compose up
#
# It starts three parts:
#   db       - a Postgres database (Supabase is Postgres too). supabase/schema.sql is run on it at the start.
#   api      - PostgREST, the same REST API that Supabase uses.
#   website  - serves the website on http://localhost:8080 and passes /rest/v1/ to the API,
#              so http://localhost:8080 works like https://YOUR-PROJECT.supabase.co
#
# The database starts EMPTY. Your test Minecraft server fills it (see README.md, "Test everything on your PC").
# Stop with Ctrl+C. Delete everything (also the test data) with:   docker compose down -v
#
# The keys and passwords below are only for this test setup on your PC. They are useless anywhere else.
name: minecraft-website-test

x-test-keys:
  # Like Supabase's keys. The website uses the "publishable" one, the plugin the "secret" one.
  publishable: &publishable eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6ImxvY2FsLWRvY2tlci10ZXN0In0.eOjFtQGYJYOnuHY-VR0apGl6hK9uINFf43tpGy9JsEU
  # Put this one into your TEST server's plugins/ClyroLandeszentrale/config.yml as supabase.secret-key.
  secret: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoibG9jYWwtZG9ja2VyLXRlc3QifQ.IvG1-sTkHzoKDzHLlNiwctsvuiJWESlJlfR0wRYoVLQ

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test123
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ../supabase/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:test123@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-test-secret-only-for-docker-not-for-real-use
      # Like Supabase: at most 1000 rows per request.
      PGRST_DB_MAX_ROWS: "1000"

  website:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - api
    environment:
      API_URL: http://api:3000
      # Same as the GitHub repository variables of the real website.
      SUPABASE_PUBLISHABLE_KEY: *publishable
      # The server name on the website comes from the motd of your test server.
      SERVER_ADDRESS: localhost
    command: ["node", "docker/test-website.mjs"]
    ports:
      # The website AND the API for your test Minecraft server (supabase.url: "http://127.0.0.1:8080").
      - "8080:8080"
    volumes:
      - ..:/app:ro

volumes:
  db-data:
