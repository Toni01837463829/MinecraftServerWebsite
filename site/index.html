<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Stats</title>
  <meta name="description" content="Who is online and player stats of our Minecraft server.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/monocraft.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <img class="brand-icon" src="favicon.svg" alt="">
        <span id="server-name">Server Stats</span>
      </a>
      <nav class="tabs" aria-label="Pages">
        <a href="#/" data-page="home">Overview</a>
        <a href="#/players" data-page="players">Players</a>
      </nav>
      <span class="live" id="live"><span class="pulse"></span><span id="live-text">Loading</span></span>
    </div>
  </header>

  <main id="app">
    <div class="card loading">Loading...</div>
  </main>

  <footer>
    <span id="updated">&nbsp;</span>
    <span>The stats update about every 10 minutes</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
